[project]
name = "the-listening-atlas"
version = "0.1.0"
description = "A curated, pedagogical classical-music listening atlas: canonical data, validator, exports and a static listening website."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "jinja2==3.1.6",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.8",
    "mypy==1.15.0",
    "types-pyyaml==6.0.12.20250402",
    "types-jsonschema==4.23.0.20241208",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # line length owned by `ruff format`; musical typography is intentional

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
