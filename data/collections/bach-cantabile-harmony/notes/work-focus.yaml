work_focus:
  bwv-anh-114: Follow the bass under the familiar melody. Where does the harmony turn toward home? This minuet is by Christian Petzold.
  bwv-639: Compare the instrumental line with the vocal chorale heard immediately before it. What remains singable?
  bwv-82: Listen only to the opening aria. Trace how the repeated words change meaning through harmony and breath.
  bwv-12: Hear the Sinfonia and chorus in sequence, then compare the piano transformation. What musical identity persists?
  bwv-105: Notice how the lack of a continuo bass changes your sense of harmonic ground.
  bwv-527: Sing the slow movement’s line, then notice its later transformation in the Triple Concerto.
  bwv-1044: In the slow movement, recognize material heard earlier in organ trio sonata BWV 527.
  bwv-1049: Listen for how the solo voices exchange the lead; compare its reworking as BWV 1057.
  bwv-1057: Compare the dialogue with Brandenburg Concerto No. 4, BWV 1049.
  bwv-156: Keep the oboe melody in your ear for the related slow movement of BWV 1056.
  bwv-1056: Hear the Largo in relation to the Sinfonia from BWV 156.
  bwv-582: Listen for the recurring bass pattern, the changing surface, and the point at which the fugue takes over. Verify movement coverage in this recording.
  bwv-989: Ask what remains constant across each variation, even as figuration and character change.
  bwv-988: Follow the harmonic framework across the variations; hear the final Aria as a changed return.
  bwv-232: At the Crucifixus, remember the chorus from BWV 12 and hear how its context changes.
  bwv-244: At Aus Liebe, notice how the absent continuo bass alters the music’s sense of support.
  bwv-1080: Listen for the subject’s identity through increasingly intricate relations; leave space for the unfinished fugue and concluding chorale.
  bwv-1079: Follow the royal theme across transformations, and distinguish what changes from what endures.
